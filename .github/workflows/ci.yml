# CI for when jsp/ is published as a standalone repository (repo root = this
# directory, e.g. via `git subtree split --prefix=jsp`). Inert while nested in
# the monorepo — GitHub only runs workflows from the repository root; the
# monorepo equivalent lives at /.github/workflows/jsp-ci.yml.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
